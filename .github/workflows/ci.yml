name: Cross-platform CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:architecture
      - run: npm test
      - run: npm run build:all-in-one
      - run: npm run test:package
      - run: npm run test:package -- .npm-package/dist
      - run: npm run example:consumer
      - run: npm run issue:repro:all
      - run: npm ci
        working-directory: sample-project
      - run: npm run test:helpers
        working-directory: sample-project
      - run: npm run typecheck
        working-directory: sample-project
      - run: npm run start:sub:line
        working-directory: sample-project
